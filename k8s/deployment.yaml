apiVersion: apps/v1
kind: Deployment

metadata:
  name: calculator-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: calculator

  template:
    metadata:
      labels:
        app: calculator

    spec:
      containers:
        - name: calculator
          image: elladev20/calculator-app:v1
          ports:
            - containerPort: 8080